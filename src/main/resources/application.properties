# JWT
app.jwt.secret=${JWT_SECRET:AP13SuperSecretKeyForJWTSigningMustBe256BitsLong2026}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── DATABASE — Render PostgreSQL ─────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://dpg-d7i7ss67r5hc73c5n17g-a.oregon-postgres.render.com:5432/ap13}
spring.datasource.username=${DB_USERNAME:ap13_user}
spring.datasource.password=${DB_PASSWORD:xC6Dt60v8GKntbLTcbOZpL3cHnZPb5zO}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── CONNECTION POOL ───────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / HIBERNATE ───────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false