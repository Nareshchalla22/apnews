# ── SERVER ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:AP13SuperSecretKeyForJWTSigningMustBe256BitsLong2026}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── DATABASE — AWS RDS PostgreSQL ─────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://ap13-db.clk0sk6s62na.ap-south-2.rds.amazonaws.com:5432/ap13}
spring.datasource.username=${DB_USERNAME:ap13_user}
spring.datasource.password=${DB_PASSWORD:XKZZTu27kmLiUZx}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── CONNECTION POOL ───────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / HIBERNATE ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

