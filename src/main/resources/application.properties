# ── DATABASE (Neon PostgreSQL) ─────────────────────────────────
spring.datasource.url=${postgresql://neondb_owner:npg_iYwk8g7yFNhz@ep-rough-queen-adoi6qvy-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${neondb_owner}
spring.datasource.password=${npg_wiC1OJ5DXZzg}
spring.datasource.driver-class-name=org.postgresql.Driver
# ── Connection Pool ───────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── AWS S3 ────────────────────────────────────────────────────────────────────
aws.s3.bucket=${AWS_S3_BUCKET:ap13-news-media}
aws.s3.region=${AWS_REGION:ap-south-2}
aws.access.key=${AWS_ACCESS_KEY_ID:AKIATN7ZMTWJ2ENGBYHU}
aws.secret.key=${AWS_SECRET_ACCESS_KEY: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}
aws.s3.base-url=https://${AWS_S3_BUCKET:ap13-news-media}.s3.${AWS_REGION:ap-south-2}.amazonaws.com

# ── App ───────────────────────────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:https://api.ap13news.in}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.news.apnews=INFO