# ── SERVER ───────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── DATABASE — Render PostgreSQL ─────────────────────────────────────
spring.datasource.url=$postgresql://ap13_user:xC6Dt60v8GKntbLTcbOZpL3cHnZPb5zO@dpg-d7i7ss67r5hc73c5n17g-a/ap13}
spring.datasource.username=${ap13_user}
spring.datasource.password=${xC6Dt60v8GKntbLTcbOZpL3cHnZPb5zO}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── CONNECTION POOL ───────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / HIBERNATE ───────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false